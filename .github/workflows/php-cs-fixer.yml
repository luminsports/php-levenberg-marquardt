name: Run PHP CS Fixer

on:
  push:
    branches: [ 'main', 'develop' ]
    paths: ['src/**.php']
  pull_request:
    paths: ['src/**.php']

permissions:
  contents: read

jobs:
  php-cs-fixer:
    name: Run PHP CS Fixer
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run PHP CS Fixer
        uses: luminsports/github-action-php-cs-fixer@main
        with:
          create-pull-request: ${{ github.ref_name == 'main' }}
